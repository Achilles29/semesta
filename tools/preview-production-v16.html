<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V16 — Jalannya Rusak, Acaranya Mulus</title>
<style>
body{margin:0;background:#111;color:#eee;font:14px system-ui}canvas{display:block}aside{position:fixed;top:16px;left:16px;width:340px;max-height:90vh;overflow:auto;background:#18282ef2;padding:18px;border-radius:12px}label{display:block;margin:12px 0}select,button{padding:8px;max-width:100%;margin:4px 0}p{line-height:1.5}.production-filming aside{display:none}#error{color:#ffb8a0}#audit{position:fixed;right:12px;bottom:12px;background:#20313a;padding:10px;max-width:420px}.production-filming #audit{display:none}
</style>
<aside id="panel"><h2>Produksi V16</h2><p>Preview mesin game asli. 23 shot, 6 rangkaian, suara V16.</p><p id="error">Memuat model…</p></aside>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {createHumanModel,setFarmerAsset} from '../game-src/avatar-character-3d.js';
import {buildProductionDistrict} from '../game-src/production-district-scene.js';
import {mountProductionDirector} from '../game-src/production-director.js';
try{
 for(const v of [10,13,14,15])window[v===10?'SEMESTA_PRODUCTION_VO_URL':`SEMESTA_PRODUCTION_V${v}_VO_URL`]=new URL(`../public/audio/produksi/episode-002/release-v${v}/episode-002-v${v}-master.wav`,location.href).href;
 window.SEMESTA_PRODUCTION_V16_VO_URL=new URL('../public/audio/produksi/episode-002/release-v16-r3/episode-002-v16-r3-master.wav',location.href).href;
 setFarmerAsset(await new GLTFLoader().loadAsync('../public/models/characters/semesta-farmer-v11.glb'));
 const scene=new THREE.Scene();scene.background=new THREE.Color('#d4dfe2');
 scene.add(new THREE.HemisphereLight('#fff4dd','#666f79',2.4));
 const light=new THREE.DirectionalLight('#fff3dc',3);light.position.set(-42,12,-85);scene.add(light);
 const world=new THREE.Group();scene.add(world);
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
 const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.05,200);camera.position.set(-48,6,-80);camera.lookAt(-48,1,-100);
 const production=buildProductionDistrict(THREE,{world,makeHuman(p,o){const m=createHumanModel(THREE,o);p.add(m.figure);return m;},makeText(){return new THREE.Sprite(new THREE.SpriteMaterial());},addCollider(x,z){return{x,z};},createWorldAsset(){return new THREE.Group();}});
 const abort=new AbortController(),director=mountProductionDirector({THREE,production,world,camera,renderer,scene,panel:document.querySelector('#panel'),signal:abort.signal});
 document.querySelector('#error').textContent='Siap. PLAY V16 + SUARA. Esc mengembalikan kontrol.';
 renderer.setAnimationLoop(now=>{if(director.active)director.update(now);else renderer.render(scene,camera);});
 addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);if(!director.active){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}});
 addEventListener('pagehide',()=>{abort.abort();renderer.dispose();},{once:true});
}catch(e){document.querySelector('#error').textContent=e.stack;console.error(e);}
</script></html>
